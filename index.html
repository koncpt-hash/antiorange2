<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>LP Hub TV Extra TV</title>
<style>
  /* Layout: only the Figma frame, centered, at most its native 1440px width.
     Overlays are placed in the frame's own pixel coordinates, converted to % of 1440 × 5400. */
  :root { --bg: #ffffff; --selected: #f15e00; --idle: #cccccc; --scrim: rgb(0 0 0 / .6); }
  body { background: var(--bg); margin: 0; }
  body.modal-open { overflow: hidden; }
  .lp { position: relative; max-width: 1440px; margin: 0 auto; container-type: inline-size; }
  /* One Figma pixel at the current rendered width. */
  .lp { --fpx: calc(100cqw / 1440); }
  .lp > img { display: block; width: 100%; height: auto; }
  .hit {
    position: absolute; padding: 0; margin: 0; border: 0; background: none;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .hit::after {
    content: ""; position: absolute; inset: 0; border-radius: calc(6 * var(--fpx));
    border: calc(2 * var(--fpx)) solid transparent; pointer-events: none;
  }
  .hit:focus { outline: none; }
  .hit:disabled { cursor: default; }
  .hit:focus-visible { outline: 2px solid #000; outline-offset: 3px; border-radius: 6px; }
  .lp.bez #r24::after { border-color: var(--idle); }
  .lp.bez #rbez::after { border-color: var(--selected); }
  .dishes {
    position: absolute; overflow: hidden;
    background: url("assets/bg-oferta.png") no-repeat;
  }
  /* Figma exports the cards flattened on white, so clip them to the card's own 8px radius. */
  .dishes img {
    position: absolute; top: 0; width: calc(400 / 1232 * 100%); height: 100%;
    border-radius: calc(8 * var(--fpx));
  }
  #card-start { left: calc(208 / 1232 * 100%); }
  #card-extra { left: calc(624 / 1232 * 100%); }
  .lp:not(.bez) .dishes, .lp:not(.bez) .only-bez, .lp.bez .only-24 { display: none; }
  /* Copy change painted over the mockup: the dish button reads "Zamów rozmowę" instead of "Zamów". */
  /* Switch states painted over the mockup, cut from the green and gray switches on the same screen. */
  .switch img, .lp > img.overlay { display: block; width: 100%; height: 100%; }
  .lp > img.overlay { position: absolute; pointer-events: none; }
  .lp > img.overlay[hidden] { display: none; }
  .switch[aria-checked="false"] img.on, .switch[aria-checked="true"] img.off { visibility: hidden; }
  #konfigurator.tv-off .only-kf-tv,
  #internet-mobilny:not(.tv-off) .only-tv-off, #internet-mobilny.tv-off .only-tv-on { display: none; }
  .relabel {
    position: absolute; display: grid; place-items: center; pointer-events: none;
    background: #ff7900; color: #000;
    font: 700 calc(16 * var(--fpx)) / 1 "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  /* "Sprawdź, czy jesteś w zasięgu" on Internet mobilny: live fields over the mockup, filled state = Figma 9923:107004. */
  .wwt-field {
    position: absolute; box-sizing: border-box; background: #fff;
    border: calc(2 * var(--fpx)) solid #ccc; border-radius: calc(4 * var(--fpx));
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .wwt-field:focus-within { border-color: #000; }
  .wwt-field.off { background: #ededed; }
  .wwt-field label {
    position: absolute; left: calc(16 * var(--fpx)); top: 50%; transform: translateY(-50%);
    color: #5b5b5b; font-size: calc(16 * var(--fpx)); line-height: 1; pointer-events: none;
    transition: top .12s, font-size .12s;
  }
  .wwt-field label b { color: #f16e00; font-weight: 400; }
  .wwt-field.filled label, .wwt-field:focus-within label {
    top: calc(14 * var(--fpx)); font-size: calc(12 * var(--fpx)); font-weight: 700; transform: none;
  }
  .wwt-field input {
    position: absolute; left: calc(16 * var(--fpx)); right: calc(16 * var(--fpx)); bottom: calc(8 * var(--fpx));
    height: calc(24 * var(--fpx)); padding: 0; border: 0; background: none; outline: none;
    font: 700 calc(16 * var(--fpx)) / 1 "Helvetica Neue", Helvetica, Arial, sans-serif; color: #232323;
  }
  .wwt-field.select input { right: calc(52 * var(--fpx)); }
  .wwt-field input::-webkit-calendar-picker-indicator { display: none !important; }
  .wwt-field input:disabled { cursor: default; }
  .wwt-field .chev {
    position: absolute; right: calc(8 * var(--fpx)); top: 50%; transform: translateY(-50%);
    width: calc(32 * var(--fpx)); height: calc(32 * var(--fpx)); border-radius: calc(4 * var(--fpx));
    display: grid; place-items: center; background: #f4f4f4; border: 0; padding: 0; cursor: pointer;
  }
  .wwt-field.off .chev { background: none; cursor: default; }
  .wwt-field .chev svg { width: 45%; height: 45%; }
  .wwt-check {
    position: absolute; box-sizing: border-box; padding: 0; background: #fff; cursor: pointer;
    border: calc(2 * var(--fpx)) solid #ccc; border-radius: calc(2 * var(--fpx));
    display: grid; place-items: center;
  }
  .wwt-check[aria-checked="true"] { background: #000; border-color: #000; }
  .wwt-check svg { width: 70%; height: 70%; visibility: hidden; }
  .wwt-check[aria-checked="true"] svg { visibility: visible; }

  /* Loading screen after "Pokaż oferty", shown for 3 s. */
  .loader {
    position: fixed; inset: 0; z-index: 30; background: #fff;
    display: grid; place-content: center; justify-items: center; gap: 32px; padding: 16px; text-align: center;
  }
  .loader[hidden] { display: none; }
  .loader span { width: 42px; height: 42px; background: #f16e00; animation: loader-spin 1.2s ease-in-out infinite; }
  .loader p { margin: 0; color: #000; font: 700 20px / 1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  @keyframes loader-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .loader span { animation: none; } }

  /* Modals, all 816px wide: "Szczegóły" = Figma 9236:79233 (FTTH) / 9236:79612 (Standalone),
     "Lista kanałów" = Figma 8637:100574. */
  .scrim {
    position: fixed; inset: 0; z-index: 20; background: var(--scrim);
    overflow-y: auto; overscroll-behavior: contain;
    /* Pinned to the top so switching tabs only grows or shrinks the modal downwards. */
    display: grid; align-items: start; justify-items: center;
    padding: max(48px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
             max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .modal {
    position: relative; width: min(816px, 100%); container-type: inline-size;
    border-radius: 8px; overflow: hidden; box-shadow: 0 8px 32px rgb(0 0 0 / .35);
  }
  .modal { --mpx: calc(100cqw / 816); }
  /* "Zamów rozmowę" modal = Figma 9364:183929, 608px wide. */
  .modal.narrow { width: min(608px, 100%); --mpx: calc(100cqw / 608); }
  /* "Lista kanałów" is 1728px tall, so it scrolls inside the modal; hits sit in .modal-inner to stay
     relative to the full image rather than the 600px viewport. */
  .modal.scroll {
    max-height: min(600px, calc(100dvh - 72px)); overflow-y: auto; overscroll-behavior: contain;
  }
  .modal-inner { position: relative; }
  .modal-inner > img { display: block; width: 100%; height: auto; }
  .modal > img { display: block; width: 100%; height: auto; }
  .modal .hit::after { display: none; }
  .modal .hit:focus-visible { border-radius: calc(4 * var(--mpx)); }
  @media (prefers-reduced-motion: no-preference) {
    .scrim:not([hidden]) { animation: fade .16s ease-out; }
    .scrim:not([hidden]) .modal { animation: rise .2s ease-out; }
  }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(12px); opacity: 0; } }
</style>
</head>

      <button class="hit" data-close data-mbox="772,4,40,40" aria-label="Zamknij"></button>
      <button class="hit" data-tab="lista" data-mbox="20,102,388,40" aria-label="Lista kanałów"></button>
      <button class="hit" data-tab="jak" data-mbox="408,102,388,40" aria-label="Na czym oglądać?"></button>
      <button class="hit" data-v="lista" data-close data-mbox="720,702,76,46" aria-label="Wróć"></button>
      <button class="hit" data-v="jak" data-close data-mbox="720,498,76,46" aria-label="Wróć"></button>
    </div>
  </div>
</div>

<div class="scrim" id="m-details" hidden>
  <!-- Copy update: Figma 9774:132417 (ze światłowodem Orange) / 9774:133355 (na dowolnym dostępie do internetu).
       Figma has "Oto nasza telewizja" only on the second tab; it is copied into the first so the tabs stay put. -->
  <div class="modal scroll" role="dialog" aria-modal="true" aria-label="Szczegóły: Wybierz telewizję dla siebie" data-tabs="ftth,standalone" data-h-ftth="1503" data-h-standalone="1500">
    <div class="modal-inner">
      <img data-v="ftth" src="assets/modal-ftth@2x.png" width="816" height="1503" alt="Szczegóły, zakładka ze światłowodem Orange: łącznie 230 kanałów TV, Start TV i Extra TV, lista kanałów, Amazon Prime w prezencie">
      <img data-v="standalone" src="assets/modal-standalone@2x.png" width="816" height="1500" alt="Szczegóły, zakładka na dowolnym dostępie do internetu: 47 albo 179 kanałów, Start TV i Extra TV, lista kanałów, Amazon Prime w prezencie">
      <button class="hit" data-close data-mbox="772,4,40,40" aria-label="Zamknij"></button>
      <button class="hit" data-v="ftth" data-tab="ftth" data-mbox="20,138,388,40" aria-label="ze światłowodem Orange"></button>
      <button class="hit" data-v="ftth" data-tab="standalone" data-mbox="408,138,388,40" aria-label="na dowolnym dostępie do internetu"></button>
      <button class="hit" data-v="standalone" data-tab="ftth" data-mbox="20,138,388,40" aria-label="ze światłowodem Orange"></button>
      <button class="hit" data-v="standalone" data-tab="standalone" data-mbox="408,138,388,40" aria-label="na dowolnym dostępie do internetu"></button>
      <button class="hit" data-v="ftth" data-close data-mbox="720,1441,76,46" aria-label="Wróć"></button>
      <button class="hit" data-v="standalone" data-close data-mbox="720,1438,76,46" aria-label="Wróć"></button>
    </div>
  </div>
</div>

<script>
  const W = 1440;
  const pct = (v, of) => (v / of * 100) + "%";
  // A screen can swap in a taller or shorter mockup: screen.shifts = [[y, dy], ...] moves every box at y or below
  // by dy, and screen.hNow is the swapped mockup's height.
  const placeBoxes = screen => screen.querySelectorAll("[data-box]").forEach(el => {
    let [x, y, w, h] = el.dataset.box.split(",").map(Number);
    const H = screen.hNow || Number(screen.dataset.h);
    for (const [gy, dy] of screen.shifts || []) if (Number(el.dataset.box.split(",")[1]) >= gy) y += dy;
    Object.assign(el.style, { left: pct(x, W), top: pct(y, H), width: pct(w, W), height: pct(h, H) });
  });
  document.querySelectorAll(".lp").forEach(placeBoxes);

  // Background of the offer section (Figma "multi grid bg desktop"), sits at 59,1315 in the frame.
  const dishes = document.getElementById("dishes");
  dishes.style.backgroundSize = `${1240 / 1232 * 100}% ${832 / 420 * 100}%`;
  dishes.style.backgroundPosition = `${(59 - 104) / (1232 - 1240) * 100}% ${(1315 - 1452) / (420 - 832) * 100}%`;

  const lp = document.getElementById("lp");
  const set = bez => {
    lp.classList.toggle("bez", bez);
    document.getElementById("r24").setAttribute("aria-pressed", !bez);
    document.getElementById("rbez").setAttribute("aria-pressed", bez);
  };
  document.getElementById("r24").addEventListener("click", () => set(false));
  document.getElementById("rbez").addEventListener("click", () => set(true));

  document.querySelectorAll(".switch").forEach(sw => sw.addEventListener("click", () => {
    sw.setAttribute("aria-checked", sw.getAttribute("aria-checked") !== "true");
  }));
  // Internet mobilny state: the 5G plan switch (Netflix active, 5G line in the cards), the TV switch
  // (CTA copy) and the contract length. Bezterminowo needs TV and shows a single dish (Figma 9922:105924).
  const im = document.getElementById("internet-mobilny");
  const sw5g = document.getElementById("sw-5g"), swTv = document.getElementById("sw-tv");
  const imR24 = document.getElementById("im-r24"), imRbez = document.getElementById("im-rbez");
  let imBez = false;
  const renderIm = () => {
    const on5g = sw5g.getAttribute("aria-checked") === "true";
    const tv = swTv.getAttribute("aria-checked") === "true";
    if (!tv) imBez = false;
    document.getElementById("netflix-active").hidden = !on5g;
    im.classList.toggle("tv-off", !tv);
    im.classList.toggle("bez", imBez);
    imR24.setAttribute("aria-pressed", !imBez);
    imRbez.setAttribute("aria-pressed", imBez);
    imRbez.disabled = !tv;
    // Mockup per state: the 5G plan adds a line to the cards (+64 from y 1172), no TV removes the TV block (-100).
    const [src, h, shifts] = imBez ? ["assets/internet-mobilny-bez@2x.jpg", 3496, []]
      : tv && on5g ? ["assets/internet-mobilny-5g@2x.jpg", 3596, [[1172, 64]]]
      : tv ? ["assets/internet-mobilny@2x.jpg", 3532, []]
      : on5g ? ["assets/internet-mobilny-notv-5g@2x.jpg", 3496, [[1172, -36]]]
      : ["assets/internet-mobilny-notv@2x.jpg", 3432, [[1172, -100]]];
    const img = im.querySelector(":scope > img");
    img.src = src;
    img.height = h;
    im.hNow = h;
    im.shifts = shifts;
    placeBoxes(im);
  };
  sw5g.addEventListener("click", renderIm);
  swTv.addEventListener("click", renderIm);
  imR24.addEventListener("click", () => { imBez = false; renderIm(); });
  imRbez.addEventListener("click", () => { imBez = true; renderIm(); });
  ["assets/internet-mobilny-5g@2x.jpg", "assets/internet-mobilny-bez@2x.jpg", "assets/internet-mobilny-notv@2x.jpg", "assets/internet-mobilny-notv-5g@2x.jpg"].forEach(src => { new Image().src = src; });
  // Coverage form: each field unlocks once the one before it has a value.
  const wwt = id => document.getElementById("wwt-" + id);
  const wwtUpdate = () => {
    const noStreet = wwt("nostreet").getAttribute("aria-checked") === "true";
    const city = wwt("city").value.trim() !== "";
    wwt("street").disabled = !city || noStreet;
    if (noStreet) wwt("street").value = "";
    const numbers = city && (noStreet || wwt("street").value.trim() !== "");
    wwt("house").disabled = wwt("flat").disabled = !numbers;
    im.querySelectorAll(".wwt-field").forEach(f => {
      const input = f.querySelector("input");
      f.classList.toggle("off", input.disabled);
      f.classList.toggle("filled", input.value !== "");
    });
  };
  im.querySelectorAll(".wwt-field input").forEach(i => i.addEventListener("input", wwtUpdate));
  im.querySelectorAll(".wwt-field .chev").forEach(c => c.addEventListener("click", () => {
    const input = c.parentElement.querySelector("input");
    if (input.disabled) return;
    input.focus();
    try { input.showPicker(); } catch (e) {}
  }));
  // Konfigurator: the TV switch swaps between the TV + internet dishes and the internet-only ones;
  // either can be on a 24-month contract or Bezterminowo.
  const kf = document.getElementById("konfigurator"), kfTv = document.getElementById("kf-tv");
  const kfR24 = document.getElementById("kf-r24"), kfRbez = document.getElementById("kf-rbez");
  let kfBez = false;
  const renderKf = () => {
    const tv = kfTv.getAttribute("aria-checked") === "true";
    kf.classList.toggle("tv-off", !tv);
    kf.classList.toggle("bez", kfBez);
    kfR24.setAttribute("aria-pressed", !kfBez);
    kfRbez.setAttribute("aria-pressed", kfBez);
    const [src, h] = tv ? (kfBez ? ["assets/fwa-tv-bez@2x.jpg", 2256] : ["assets/fwa@2x.jpg", 2326])
      : kfBez ? ["assets/fwa-notv-bez@2x.jpg", 2150] : ["assets/fwa-notv@2x.jpg", 2114];
    const img = kf.querySelector(":scope > img");
    img.src = src;
    img.height = kf.hNow = h;
    placeBoxes(kf);
  };
  kfTv.addEventListener("click", () => {
    kfTv.setAttribute("aria-checked", kfTv.getAttribute("aria-checked") !== "true");
    renderKf();
  });
  kfR24.addEventListener("click", () => { kfBez = false; renderKf(); });
  kfRbez.addEventListener("click", () => { kfBez = true; renderKf(); });
  ["assets/fwa-notv-bez@2x.jpg", "assets/fwa-tv-bez@2x.jpg"].forEach(src => { new Image().src = src; });
  new Image().src = "assets/fwa-notv@2x.jpg";
  let loaderTimer;
  wwt("submit").addEventListener("click", () => {
    const loader = document.getElementById("loader");
    loader.hidden = false;
    clearTimeout(loaderTimer);
    loaderTimer = setTimeout(() => { loader.hidden = true; location.hash = "konfigurator"; }, 3000);
  });
  wwt("nostreet").addEventListener("click", () => {
    const b = wwt("nostreet");
    b.setAttribute("aria-checked", b.getAttribute("aria-checked") !== "true");
    wwtUpdate();
  });


  // Modal hit areas use the modal's own coordinates (816px wide unless data-w says otherwise);
  // in a tabbed modal (data-tabs) only the current tab's [data-v] elements show, and its height is data-h-<tab>.
  let current = null, opener = null;
  const placeModalHits = modal => {
    const mw = Number(modal.dataset.w || 816);
    const tab = modal.dataset.view;
    const mh = Number(tab ? modal.getAttribute("data-h-" + tab) : modal.dataset.h);
    modal.querySelectorAll("[data-mbox]").forEach(el => {
      const [x, y, w, h] = el.dataset.mbox.split(",").map(Number);
      Object.assign(el.style, { left: pct(x, mw), top: pct(y, mh), width: pct(w, mw), height: pct(h, mh) });
    });
  };
  const setTab = (modal, tab) => {
    if (tab) {
      modal.dataset.view = tab;
      modal.querySelectorAll("[data-v]").forEach(el => { el.hidden = el.dataset.v !== tab; });
      modal.scrollTop = 0;
    }
    placeModalHits(modal);
  };
  const open = (id, from) => {
    const scrim = document.getElementById(id), modal = scrim.querySelector(".modal");
    setTab(modal, modal.dataset.tabs?.split(",")[0]);
    scrim.hidden = false;
    document.body.classList.add("modal-open");
    scrim.scrollTop = modal.scrollTop = 0;
    current = scrim; opener = from;
    modal.querySelector("[data-close]").focus({ preventScroll: true });
  };
  const close = () => {
    if (!current) return;
    current.hidden = true; current = null;
    document.body.classList.remove("modal-open");
    opener?.focus({ preventScroll: true });
  };
  document.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => open(b.dataset.open, b)));
  document.querySelectorAll(".scrim").forEach(scrim => {
    const modal = scrim.querySelector(".modal");
    modal.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", close));
    modal.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => setTab(modal, b.dataset.tab)));
    scrim.addEventListener("click", e => { if (e.target === scrim) close(); });
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });

  // Screen routing: "#<screen id>" shows that screen, anything else the landing page.
  // The landing page's scroll position is kept so coming back lands where you left.
  const screens = [...document.querySelectorAll(".lp")];
  let lpScroll = 0;
  const route = () => {
    const target = screens.find(s => s !== lp && "#" + s.id === location.hash) || lp;
    if (target === lp && lp.hidden === false) return;
    if (!lp.hidden) lpScroll = scrollY;
    close();
    screens.forEach(s => { s.hidden = s !== target; });
    scrollTo(0, target === lp ? lpScroll : 0);
  };
  addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
